# XcodeGen spec for the iOS app. Generate the project with `xcodegen generate` in this folder.
name: KDL
options:
  bundleIdPrefix: com.abrignoni
  deploymentTarget:
    iOS: "17.0"
packages:
  KDLCore:
    path: KDLCore
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 33DUL485L9
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  KDL:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - package: KDLCore
      - target: KDLWidgets
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: KDL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/KDL.entitlements
      properties:
        com.apple.security.application-groups: [group.com.abrignoni.knowndatalogger]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abrignoni.knowndatalogger
        PRODUCT_NAME: KDL
  KDLWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared]
    dependencies:
      - package: KDLCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: KDL Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/KDLWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.abrignoni.knowndatalogger]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abrignoni.knowndatalogger.widgets
