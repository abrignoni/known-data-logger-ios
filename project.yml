# XcodeGen spec for the iOS app. Generate the project with `xcodegen generate` in this folder.
name: KDL
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  KDLCore:
    path: KDLCore
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  KDL:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - package: KDLCore
      - target: KDLWidgets
      - target: KDLBroadcast
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: KDL
        KDLAppId: $(KDL_APP_ID)
        KDLAppGroup: $(KDL_APP_GROUP)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/KDL.entitlements
      properties:
        com.apple.security.application-groups: [$(KDL_APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(KDL_APP_ID)
        PRODUCT_NAME: KDL
  KDLBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - Broadcast
      - Shared/KDL.swift
    dependencies:
      - package: KDLCore
      - sdk: ReplayKit.framework
    info:
      path: Broadcast/Info.plist
      properties:
        CFBundleDisplayName: KDL Screen
        KDLAppId: $(KDL_APP_ID)
        KDLAppGroup: $(KDL_APP_GROUP)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    entitlements:
      path: Broadcast/KDLBroadcast.entitlements
      properties:
        com.apple.security.application-groups: [$(KDL_APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(KDL_APP_ID).broadcast
  KDLWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared]
    dependencies:
      - package: KDLCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: KDL Widgets
        KDLAppId: $(KDL_APP_ID)
        KDLAppGroup: $(KDL_APP_GROUP)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/KDLWidgets.entitlements
      properties:
        com.apple.security.application-groups: [$(KDL_APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(KDL_APP_ID).widgets
